<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#F0FDF4" rx="16"/>
  <!-- Bag Body -->
  <path d="M70,70 L230,70 L215,260 L85,260 Z" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/>
  <!-- Bag Top Stitch / Seal -->
  <rect x="60" y="55" width="180" height="15" fill="#16A34A" rx="3"/>
  <line x1="60" y1="62" x2="240" y2="62" stroke="#86EFAC" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Brand Header Banner -->
  <rect x="75" y="85" width="150" height="38" fill="#15803D" rx="4"/>
  <text x="150" y="102" fill="#FEF08A" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FAUJI FERTILIZER</text>
  <text x="150" y="117" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SONA UREA</text>
  <!-- Nitrogen Badge -->
  <circle cx="150" cy="165" r="32" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <text x="150" y="160" fill="#15803D" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">NITROGEN</text>
  <text x="150" y="180" fill="#14532D" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">46%</text>
  <!-- Product Label -->
  <text x="150" y="222" fill="#14532D" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PRILLED UREA</text>
  <rect x="110" y="234" width="80" height="18" fill="#DCFCE7" rx="9"/>
  <text x="150" y="247" fill="#16A34A" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">50 KG NET</text>
</svg>
