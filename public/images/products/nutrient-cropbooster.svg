  <text x="150" y="225" fill="#059669" font-family="sans-serif" font-size="9" text-anchor="middle">+ CHELATED TE</text>
  <rect x="110" y="232" width="80" height="16" fill="#D1FAE5" rx="8"/>
  <text x="150" y="244" fill="#047857" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1 KG NET</text>
</svg>
