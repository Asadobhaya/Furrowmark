<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#FEF2F2" rx="16"/>
  <!-- Bottle Cap -->
  <rect x="130" y="45" width="40" height="25" fill="#DC2626" rx="4"/>
  <line x1="130" y1="52" x2="170" y2="52" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="130" y1="58" x2="170" y2="58" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Bottle Neck -->
  <rect x="135" y="70" width="30" height="20" fill="#E5E7EB"/>
  <!-- Bottle Shoulder and Body -->
  <path d="M135,90 L105,120 L105,255 L195,255 L195,120 L165,90 Z" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/>
  <!-- Bottle Label -->
  <rect x="110" y="130" width="80" height="95" fill="#FEF2F2" rx="4" stroke="#F87171" stroke-width="1.5"/>
  <rect x="110" y="130" width="80" height="22" fill="#B91C1C" rx="2"/>
  <text x="150" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">FMC PAKISTAN</text>
  <text x="150" y="172" fill="#991B1B" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">CORAGEN</text>
  <text x="150" y="188" fill="#B91C1C" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">20 SC</text>
  <text x="150" y="210" fill="#4B5563" font-family="sans-serif" font-size="8" text-anchor="middle">INSECTICIDE</text>
  <!-- Volume Badge -->
  <rect x="120" y="232" width="60" height="16" fill="#FEE2E2" rx="8"/>
  <text x="150" y="244" fill="#991B1B" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">100 ML</text>
</svg>
