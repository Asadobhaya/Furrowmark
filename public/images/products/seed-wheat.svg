<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#FFFBEB" rx="16"/>
  <!-- Bag Body -->
  <path d="M70,75 L230,75 L215,255 L85,255 Z" fill="#FFFFFF" stroke="#92400E" stroke-width="4"/>
  <!-- Bag Top Stitch / Seal -->
  <rect x="60" y="60" width="180" height="15" fill="#92400E" rx="3"/>
  <line x1="60" y1="67" x2="240" y2="67" stroke="#FDE68A" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Brand Header Banner -->
  <rect x="75" y="90" width="150" height="36" fill="#78350F" rx="4"/>
  <text x="150" y="113" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ENGRO AGRITECH</text>
  <!-- Wheat Ear Motif -->
  <circle cx="150" cy="165" r="28" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <line x1="150" y1="145" x2="150" y2="185" stroke="#B45309" stroke-width="2.5"/>
  <ellipse cx="143" cy="155" rx="6" ry="3" fill="#F59E0B" transform="rotate(-30 143 155)"/>
  <ellipse cx="157" cy="155" rx="6" ry="3" fill="#F59E0B" transform="rotate(30 157 155)"/>
  <ellipse cx="143" cy="165" rx="6" ry="3" fill="#F59E0B" transform="rotate(-30 143 165)"/>
  <ellipse cx="157" cy="165" rx="6" ry="3" fill="#F59E0B" transform="rotate(30 157 165)"/>
  <ellipse cx="150" cy="148" rx="6" ry="3" fill="#F59E0B" transform="rotate(90 150 148)"/>
  <!-- Product Label -->
  <text x="150" y="220" fill="#78350F" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">FAISALABAD WHEAT 08</text>
  <rect x="110" y="232" width="80" height="18" fill="#FDE68A" rx="9"/>
  <text x="150" y="245" fill="#92400E" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">50 KG NET</text>
</svg>
