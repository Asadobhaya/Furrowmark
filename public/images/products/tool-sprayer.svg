<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#F8FAFC" rx="16"/>
  <!-- Sprayer Tank Body -->
  <rect x="95" y="80" width="110" height="150" fill="#0284C7" stroke="#0369A1" stroke-width="4" rx="16"/>
  <!-- Tank Lid -->
  <rect x="125" y="60" width="50" height="20" fill="#0F172A" rx="4"/>
  <rect x="135" y="52" width="30" height="8" fill="#334155" rx="2"/>
  <!-- Tank Base -->
  <rect x="90" y="225" width="120" height="15" fill="#0F172A" rx="4"/>
  <!-- Carry Handle -->
  <path d="M120,60 C120,38 180,38 180,60" stroke="#0F172A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Battery Gauge on Tank -->
  <rect x="110" y="115" width="80" height="40" fill="#0369A1" rx="4"/>
  <text x="150" y="132" fill="#E0F2FE" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">12V BATTERY</text>
  <text x="150" y="147" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ELECTRIC</text>
  <!-- Spray Lance / Wand -->
  <line x1="215" y1="230" x2="235" y2="100" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  <line x1="235" y1="100" x2="245" y2="85" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <!-- Product Label -->
  <text x="150" y="185" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AGRIPRO 16L</text>
  <text x="150" y="200" fill="#BAE6FD" font-family="sans-serif" font-size="9" text-anchor="middle">BACKPACK SPRAYER</text>
</svg>
