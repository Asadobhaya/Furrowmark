<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#EFF6FF" rx="16"/>
  <!-- Bag Body -->
  <path d="M70,70 L230,70 L215,260 L85,260 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
  <!-- Bag Top Stitch / Seal -->
  <rect x="60" y="55" width="180" height="15" fill="#2563EB" rx="3"/>
  <line x1="60" y1="62" x2="240" y2="62" stroke="#93C5FD" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Brand Header Banner -->
  <rect x="75" y="85" width="150" height="38" fill="#1E40AF" rx="4"/>
  <text x="150" y="102" fill="#93C5FD" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FAUJI FERTILIZER</text>
  <text x="150" y="117" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SOLUBLE SOP</text>
  <!-- Formula Badge -->
  <circle cx="150" cy="165" r="32" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="150" y="160" fill="#1D4ED8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">POTASSIUM</text>
  <text x="150" y="180" fill="#1E3A8A" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">0-0-50</text>
  <!-- Product Label -->
  <text x="150" y="222" fill="#1E3A8A" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SULPHATE OF POTASH</text>
  <rect x="110" y="234" width="80" height="18" fill="#DBEAFE" rx="9"/>
  <text x="150" y="247" fill="#2563EB" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">25 KG NET</text>
</svg>
