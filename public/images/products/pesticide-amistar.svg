<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#F0FDF4" rx="16"/>
  <!-- Bottle Cap -->
  <rect x="125" y="45" width="50" height="25" fill="#047857" rx="4"/>
  <line x1="125" y1="52" x2="175" y2="52" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="125" y1="58" x2="175" y2="58" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Bottle Neck -->
  <rect x="135" y="70" width="30" height="20" fill="#E5E7EB"/>
  <!-- Bottle Shoulder and Body -->
  <path d="M135,90 L100,120 L100,255 L200,255 L200,120 L165,90 Z" fill="#FFFFFF" stroke="#047857" stroke-width="3"/>
  <!-- Bottle Label -->
  <rect x="105" y="130" width="90" height="95" fill="#F0FDF4" rx="4" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="105" y="130" width="90" height="22" fill="#065F46" rx="2"/>
  <text x="150" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SYNGENTA</text>
  <text x="150" y="172" fill="#064E3B" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AMISTAR TOP</text>
  <text x="150" y="188" fill="#047857" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">325 SC</text>
  <text x="150" y="210" fill="#4B5563" font-family="sans-serif" font-size="8" text-anchor="middle">BROAD FUNGICIDE</text>
  <!-- Volume Badge -->
  <rect x="120" y="232" width="60" height="16" fill="#D1FAE5" rx="8"/>
  <text x="150" y="244" fill="#047857" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">200 ML</text>
</svg>
