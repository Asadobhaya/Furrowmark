<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#FEFCE8" rx="16"/>
  <!-- Bag Body -->
  <path d="M70,75 L230,75 L215,255 L85,255 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="4"/>
  <!-- Bag Top Stitch / Seal -->
  <rect x="60" y="60" width="180" height="15" fill="#D97706" rx="3"/>
  <line x1="60" y1="67" x2="240" y2="67" stroke="#FDE047" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Brand Header Banner -->
  <rect x="75" y="90" width="150" height="36" fill="#B45309" rx="4"/>
  <text x="150" y="113" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PIONEER SEEDS</text>
  <!-- Corn Cob Motif -->
  <circle cx="150" cy="165" r="28" fill="#FEF9C3" stroke="#F59E0B" stroke-width="2"/>
  <path d="M142,150 C142,145 158,145 158,150 L156,180 C156,185 144,185 144,180 Z" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
  <path d="M136,170 C136,160 144,152 144,175" stroke="#15803D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M164,170 C164,160 156,152 156,175" stroke="#15803D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Product Label -->
  <text x="150" y="220" fill="#78350F" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">HYBRID CORN 30Y87</text>
  <rect x="110" y="232" width="80" height="18" fill="#FEF08A" rx="9"/>
  <text x="150" y="245" fill="#B45309" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">15 KG NET</text>
</svg>
