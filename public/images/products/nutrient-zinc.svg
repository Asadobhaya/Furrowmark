<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#ECFEFF" rx="16"/>
  <!-- Bag Body -->
  <path d="M75,70 L225,70 L210,255 L90,255 Z" fill="#FFFFFF" stroke="#0891B2" stroke-width="4"/>
  <!-- Bag Top Stitch / Seal -->
  <rect x="65" y="55" width="170" height="15" fill="#0891B2" rx="3"/>
  <line x1="65" y1="62" x2="235" y2="62" stroke="#67E8F9" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Brand Header Banner -->
  <rect x="80" y="85" width="140" height="36" fill="#0E7490" rx="4"/>
  <text x="150" y="108" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ICI PAKISTAN</text>
  <!-- Zinc Symbol Badge -->
  <circle cx="150" cy="160" r="30" fill="#CFFAFE" stroke="#0891B2" stroke-width="2.5"/>
  <text x="150" y="162" fill="#155E75" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Zn</text>
  <text x="150" y="178" fill="#0891B2" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">33%</text>
  <!-- Product Label -->
  <text x="150" y="215" fill="#164E63" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NUTRIVEX ZINC</text>
  <text x="150" y="230" fill="#0891B2" font-family="sans-serif" font-size="10" text-anchor="middle">CHELATED MICRONUTRIENT</text>
  <rect x="110" y="238" width="80" height="16" fill="#CFFAFE" rx="8"/>
  <text x="150" y="250" fill="#0891B2" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">5 KG NET</text>
</svg>
